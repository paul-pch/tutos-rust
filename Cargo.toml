[workspace]
members = [
    "exercises/phase1/*",
    "exercises/phase2/*",
    "exercises/phase3/*",
    # phase4 → phase6 : ajouter le glob quand la première phase existe
    # (cargo échoue sur un glob dont le répertoire parent est absent)
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
